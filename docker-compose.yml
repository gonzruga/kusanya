services:
  postgres:
    image: postgres:17
    container_name: kusanya-postgres
    restart: always
    environment:
      POSTGRES_USER: kusanya
      POSTGRES_PASSWORD: kusanya123
      POSTGRES_DB: kusanya
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: